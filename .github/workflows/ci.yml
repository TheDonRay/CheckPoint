name: CI/CD pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Applies to every job's `run` steps, so the deploy job inherits it too.
defaults:
  run:
    working-directory: backend

# Never let two deploys of main race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- CI STAGE ---
  cibuild:
    name: Build & test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build --if-present
      # - run: npm test

  # --- CD STAGE ---
  deploy:
    name: Deployment set up
    needs: cibuild
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy steps
        run: echo "Deploying your application to production..."
